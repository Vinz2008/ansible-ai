- name: Create ComfyUI data directories
  ansible.builtin.file:
    path: "{{ comfy_dir }}"
    state: directory
    mode: "0755"


- name: Clone ComfyUI
  ansible.builtin.git:
    repo: https://github.com/Comfy-Org/ComfyUI
    dest: "{{ comfy_dir }}/comfyui-git"
    version: master
    update: true

- name: Create venv
  ansible.builtin.command:
    cmd: "python3 -m venv {{ comfy_dir }}/venv"
    creates: "{{ comfy_dir }}/venv/bin/python"

- name: Install ROCm PyTorch for Strix Halo
  ansible.builtin.pip:
    name:
      - torch
      - torchvision
      - torchaudio
    virtualenv: "{{ comfy_dir }}/venv"
    extra_args: "--pre --index-url https://rocm.nightlies.amd.com/v2/gfx1151/"
  # notify: Restart ComfyUI

- name: Install ComfyUI requirements
  ansible.builtin.pip:
    requirements: "{{ comfy_dir }}/comfyui-git/requirements.txt"
    virtualenv: "{{ comfy_dir }}/venv"
  # notify: Restart ComfyUI

- name: Create ComfyUI data directories
  ansible.builtin.file:
    path: "{{ comfy_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - input
    - output
    - user

- name: Create user systemd directory
  ansible.builtin.file:
    path: "{{ home_folder }}/.config/systemd/user"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Create user systemd configuration directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/systemd/user"
    state: directory
    mode: "0755"

