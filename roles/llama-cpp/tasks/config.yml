- name: Create llama-swap configuration directory
  become: true
  ansible.builtin.file:
    path: /etc/llama-swap
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install llama-swap config
  become: true
  ansible.builtin.template:
    dest: /etc/llama-swap/config.yaml
    src: config.yaml
    mode: "0644"

- name: Install llama-swap user service
  become: true
  ansible.builtin.template:
    dest: "{{ ansible_user_dir }}/.config/systemd/user/llama-swap.service"
    src: llama-swap.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart llama-swap

- name: Enable and start llama-swap
  become: true
  ansible.builtin.systemd_service:
    name: llama-swap.service
    enabled: true
    state: started
