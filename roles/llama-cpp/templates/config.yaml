# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

globalTTL: 120

models:
# if RAM is complicated on the 70B model, switch the cache type to q4_0
  llama3.3-70b:
    name: "Llama 3.3 70B Instruct"
    cmd: >-
      /usr/local/bin/llama-server
      --model {{ home_folder }}/llama-cpp-models/llama3.3-70b/Llama-3.3-70B-Instruct-Q4_K_M.gguf
      --host 127.0.0.1
      --port ${PORT}
      --ctx-size 8192
      --parallel 1
      --n-gpu-layers 999
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
    ttl: 60
  qwen3.6-35b:
    name: "Qwen 3.6 35B A3B Vision"
    cmd: >-
      /usr/local/bin/llama-server
      --model {{ home_folder }}/llama-cpp-models/qwen3.6-35b/Qwen_Qwen3.6-35B-A3B-Q4_K_M.gguf
      --mmproj {{ home_folder }}/llama-cpp-models/qwen3.6-35b/mmproj-Qwen_Qwen3.6-35B-A3B-f16.gguf
      --host 127.0.0.1
      --port ${PORT}
      --ctx-size 32768
      --parallel 1
      --n-gpu-layers 999
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
    ttl: 120

  gemma4-12b:
    name: "Gemma 4 12B Vision"
    cmd: >-
      /usr/local/bin/llama-server
      --model {{ home_folder }}/llama-cpp-models/gemma4-12b/gemma-4-12B-it-Q6_K.gguf
      --mmproj {{ home_folder }}/llama-cpp-models/gemma4-12b/mmproj-gemma-4-12B-it-f16.gguf
      --host 127.0.0.1
      --port ${PORT}
      --ctx-size 65536
      --parallel 1
      --n-gpu-layers 999
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
    ttl: 120

  # qwen title is kept on cpu (--n-gpu-layers 0)
  # TODO : in the future, maybe use it on the npu ?
  qwen-title:
    cmd: >-
      /usr/local/bin/llama-server
      --model {{ home_folder }}/llama-cpp-models/qwen2.5-0.5b/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
      --host 127.0.0.1
      --port ${PORT}
      --ctx-size 4096
      --parallel 2
      --n-gpu-layers 0
      --jinja


hooks:
  on_startup:
    preload:
      - qwen-title

routing:
  router:
    use: group
    settings:
      groups:
        task-model:
          persistent: true
          swap: false
          exclusive: false
          members:
            - qwen-title

        large-models:
          swap: true
          exclusive: false
          members:
            - qwen3.6-35b
            - llama3.3-70b